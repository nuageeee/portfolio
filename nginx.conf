server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Page d'erreur maison, avec le ciel
    error_page 404 /404.html;

    # Compression des fichiers texte
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Petite protection de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers générés par Vite : leur nom change à chaque build, on peut les garder un an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Polices : elles ne changent pas
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # La page elle-même : toujours revérifiée, pour que tes mises à jour soient vues tout de suite
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    # La page 404 elle-même : servie seulement en cas d'erreur, pas en accès direct
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
